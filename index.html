<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Senac Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="static/css/base.css">

    <style>
        .inputForm {
        border: 1.5px solid #ecedec;
        border-radius: 10px;
        height: 50px;
        display: flex;
        align-items: center;
        padding-left: 10px;
        transition: 0.2s ease-in-out;
        }

        .input {
        margin-left: 10px;
        border-radius: 10px;
        border: none;
        width: 85%;
        height: 100%;
        }

        .input:focus {
        outline: none;
        }
        .inputForm:focus-within {
          border: 1.5px solid #2d79f3;
        }

    </style>

  </head>
  <body>
    
    <div class="d-md-flex">


        <img class="flex-fill img-fluid vh-100" src="static/Assets - projeto estacionamento/Professional parking facility background.png" alt="">
        

        <div class="flex-fill flex-column vw-100 vh-100 justify-content-center align-items-center">
            <div class="d-flex w-100 m-100 align-items-center flex-column" style="margin: 0 20px; 0 20px;">

                <img src="static/Assets - projeto estacionamento/senac.svg" alt="Logo Senac" class="mb-3" style="width: 96px; height: 96px;">

                <h1 class="text-center" style="font-size: 28px;">Senac CEP Papaléo</h1>
                <h2 class="text-center text-secondary" style="font-size: 20px;">Gestão de Estacionamento</h2>

                <form action="./apps/" method="post" class="w-100 mt-3">  <!-- ! formulario -->


                    <div class="mb-3"> 
                        <label for="cpf" class="form-label">CPF ou CNH</label>
                        <div class="inputForm"> <!-- ! Input cpf fazer o sistema de cpf -->
                            <img src="static/Assets - projeto estacionamento/Icon-cracha.svg" alt="" >
                            <input type="text" class="input" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <div class="mb-4"> <!-- ! Input senha -->
                        <label for="exampleInputPassword1" class="form-label">Senha</label>
                        <div class="inputForm">
                            <img src="static/Assets - projeto estacionamento/Icon-cadeado.svg" alt="" >
                            <input type="password" class="input" id="exampleInputPassword1" required placeholder="********">
                            <img src="static/Assets - projeto estacionamento/Icon-eye.svg" alt="" >
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Lembrar neste dispositivo</label>
                    </div>
                    <button type="submit" class="w-100 btn btn-primary btn-lg fw-bold">Entrar</button>

                </form> <!-- ! fim formulario -->
                
                
                
            </div>
            <div class="d-flex justify-content-center align-items-center mt-5">
                <p class="text-secondary">todos os direitos reservados</p>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
